name: Update financial data

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch financial data
        run: node scripts/fetch-data.mjs

      - name: Commit and push changes if data changed
        run: |
          if git diff --quiet -- src/data/financials.json; then
            echo "No changes in financial data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/financials.json
          git commit -m "chore: update financial data"
          git pull --rebase origin main
          git push
